[package]
name = "hylo-exchange"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "hylo_exchange"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "hylo-fix/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
test-sbf = []

[dependencies]
anchor-lang = { workspace = true, features = ["event-cpi"] }
anchor-spl = { workspace = true, features = ["metadata"] }
hylo-fix = { workspace = true }
hylo-core = { workspace = true }
hylo-idl = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-address-lookup-table-interface = { workspace = true, features = ["bincode", "bytemuck"] }
pyth-solana-receiver-sdk = { version = "=1.2.0", features = ["pro-compatible"] }

[dev-dependencies]
mollusk-svm = "~0.4"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
