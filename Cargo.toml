[workspace]
members = [
    "programs/*"
]
resolver = "2"

[workspace.package]
# Matches Solana platform-tools cargo 1.84 (no edition 2024).
rust-version = "1.84"

[workspace.dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"
hylo-core = "2.5.0"
hylo-fix = "0.8.0"
hylo-idl = "2.5.0"
solana-sdk-ids = "2.2.1"
solana-address-lookup-table-interface = "2.2.2"
inf1-svc-core = { git = "https://github.com/igneous-labs/inf-1.5.git" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
